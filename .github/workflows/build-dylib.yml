name: build-dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'tweak/**'
      - '.github/workflows/build-dylib.yml'

jobs:
  dylib:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libplist-dev libssl-dev make git unzip curl zip
          clang --version | head -2
          ld.lld --version | head -1
          apt-get install -y -qq ldid || echo "no ldid pkg"

      - name: Fetch iPhoneOS SDK
        run: |
          set -eux
          cd $RUNNER_TEMP
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks
          cd sdks && git sparse-checkout set iPhoneOS15.6.sdk
          du -sh iPhoneOS15.6.sdk
          echo "SDK=$RUNNER_TEMP/sdks/iPhoneOS15.6.sdk" >> $GITHUB_ENV

      - name: Build ldid if missing
        run: |
          set -eux
          if command -v ldid; then ldid -v || true; exit 0; fi
          cd $RUNNER_TEMP
          git clone --depth=1 https://github.com/ProcursusTeam/ldid.git
          cd ldid && cp /usr/include/plist/plist.h . 2>/dev/null || true
          make -j4
          sudo cp ldid /usr/local/bin/

      - name: Build dylib
        run: |
          set -eux
          mkdir -p build
          clang -target arm64-apple-ios12.0 -dynamiclib \
            -isysroot "$SDK" -fuse-ld=lld \
            -framework Foundation -fobjc-arc -O2 \
            -install_name @executable_path/Frameworks/OfflineOnly.dylib \
            -o build/OfflineOnly.dylib tweak/OfflineOnly.m
          file build/OfflineOnly.dylib || true
          ls -lh build/
          ldid -S build/OfflineOnly.dylib && echo "ldid signed"

      - name: Verify Mach-O
        run: |
          set -eux
          python3 - <<'PY'
          import struct
          b=open('build/OfflineOnly.dylib','rb').read(64)
          magic,=struct.unpack_from('<I',b,0)
          cpu,sub,ft,=struct.unpack_from('<iiI',b,4)
          print('magic %#x cputype %#x subtype %#x filetype %d'%(magic,cpu,sub,ft))
          assert magic in (0xfeedfacf,0xfeedface), 'not mach-o'
          assert cpu==0x0100000c or cpu==12, 'not arm64'
          assert ft==6, 'not dylib'
          print('OK arm64 dylib')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineOnly-dylib
          path: build/OfflineOnly.dylib
          if-no-files-found: error

name: build-offline-ipa

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "原版 IPA 的可下载地址（release asset / R2 presigned URL），2.3 GB"
        required: true
      dylib_name:
        description: "补丁 dylib 名"
        default: "OfflineOnly"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version
          df -h /

      - name: Build arm64 dylib
        run: |
          set -euo pipefail
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -framework Foundation \
            -fobjc-arc -O2 -fmodules \
            -miphoneos-version-min=12.0 \
            -install_name "@executable_path/Frameworks/${{ inputs.dylib_name }}.dylib" \
            -o "build/${{ inputs.dylib_name }}.dylib" \
            tweak/OfflineOnly.m
          lipo -info "build/${{ inputs.dylib_name }}.dylib"
          codesign --force --sign - "build/${{ inputs.dylib_name }}.dylib"
          codesign -dv "build/${{ inputs.dylib_name }}.dylib" 2>&1 | head -3
          ls -lh build/

      - name: Fetch original IPA
        run: |
          set -euo pipefail
          mkdir -p work
          curl -L --retry 3 --retry-delay 5 -o work/orig.ipa "${{ inputs.ipa_url }}"
          ls -lh work/orig.ipa
          # 校验：必须是我们分析过的那个包
          shasum -a 256 work/orig.ipa

      - name: Inject + ad-hoc sign
        run: |
          set -euo pipefail
          cd work
          unzip -q orig.ipa -d app
          APP="app/Payload/StandChillow.app"
          test -d "$APP"
          cp "../build/${{ inputs.dylib_name }}.dylib" "$APP/Frameworks/"
          chmod 755 "$APP/Frameworks/${{ inputs.dylib_name }}.dylib"
          # 纯 python 注入，不依赖 insert_dylib
          python3 "$GITHUB_WORKSPACE/tools/macho_inject.py" \
            "$APP/StandChillow" \
            "@executable_path/Frameworks/${{ inputs.dylib_name }}.dylib"
          # 先签内嵌件，再签 bundle，顺序不能反
          codesign --force --sign - "$APP/Frameworks/${{ inputs.dylib_name }}.dylib"
          codesign --force --deep --sign - "$APP"
          codesign -dv "$APP" 2>&1 | head -6

      - name: Repack
        run: |
          set -euo pipefail
          cd work
          zip -qry -1 "../Standoff2-Offline-unsigned.ipa" Payload
          cd ..
          ls -lh Standoff2-Offline-unsigned.ipa
          shasum -a 256 Standoff2-Offline-unsigned.ipa | tee Standoff2-Offline-unsigned.ipa.sha256
          # 2 GB 单文件上限：切成两半，方便当 artifact / release asset
          split -b 1800m Standoff2-Offline-unsigned.ipa part_

      - name: Upload parts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-ipa-parts
          path: |
            part_*
            Standoff2-Offline-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Attach to release (optional, needs tag)
        if: ${{ vars.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ vars.RELEASE_TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ vars.RELEASE_TAG }}" --title "Offline build" --notes "auto"
          gh release upload "${{ vars.RELEASE_TAG }}" part_* --clobber
